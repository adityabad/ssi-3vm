name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to run this scan manually

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run ZAP Baseline Scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          # Replace this with the live URL of your deployed web app or staging environment
          target: 'https://your-deployed-app-url.com' 
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false # Set to true if you want the pipeline to fail when vulnerabilities are found

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always() # Ensures the report uploads even if the scan finds issues
        with:
          name: zap-scan-report
          path: report_html.html
