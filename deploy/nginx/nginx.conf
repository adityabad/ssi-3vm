server {
    listen 80;
    server_name verifiable.id *.verifiable.id;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name verifiable.id *.verifiable.id;

    ssl_certificate /etc/letsencrypt/live/verifiable.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verifiable.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Issuer Service & SSO Portal
    location /issuer/ {
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Verifier API & Bulk Engine
    location /verifier/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Holder Agent & Web3Auth Gateway
    location /holder/ {
        proxy_pass http://localhost:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DIDComm WebSocket Mediator Gateway
    location /mediator/ {
        proxy_pass http://localhost:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
